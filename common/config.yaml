# Shared settings for both pairs. Change only by group agreement.
# Relative paths are resolved against the repository root.

seed: 42

paths:
  data_dir: data/iwildcam_v2.0
  checkpoint: checkpoints/iwildcam_erm_seed0_best_model.pth
  predictions: outputs/predictions.parquet
  embeddings: outputs/embeddings.npy
  # written by `make baselines` (linear probe on frozen ImageNet features)
  predictions_probe: outputs/predictions_probe.parquet
  embeddings_imagenet: outputs/embeddings_imagenet.npy
  probe_checkpoint: checkpoints/linear_probe.pt
  baselines: outputs/baselines.csv

dataset:
  name: iwildcam                # WILDS iWildCam (camera-trap images, 182 classes)
  version: "2.0"
  url: https://worksheets.codalab.org/rest/bundles/0x6313da2b204647e79a14b468131fcd64/contents/blob/
  # WILDS splits: train, val (OOD), test (OOD), id_val, id_test
  # evaluation splits first; train last (for kNN / embedding analyses), so evaluation rows keep their positions
  splits: [id_val, val, id_test, test, train]
  max_samples_per_split: null   # int -> fixed random subset per split (seeded); null -> all
  # Columns from metadata.csv copied into the predictions file
  metadata_columns: [location_remapped, location, sequence_remapped, seq_id, category_id, datetime, filename]

model:
  arch: resnet50                # torchvision, as in the WILDS baseline
  num_classes: 182
  image_size: [448, 448]        # WILDS iwildcam target_resolution
  # WILDS ERM baseline, seed 0 (CodaLab bundle iwildcam_erm_seed0)
  checkpoint_url: https://worksheets.codalab.org/rest/bundles/0xc006392d35404899bf248d8f3dc8a8f2/contents/blob/best_model.pth

inference:
  batch_size: 32
  num_workers: 4
  device: auto                  # auto | cuda | cpu
  save_embeddings: true         # 2048-d penultimate features of both models (~1.7 GB each), row-aligned with predictions

# Baseline: frozen ImageNet ResNet-50 features + logistic regression, trained on `train`
linear_probe:
  C: 1.0                        # inverse L2 regularization strength (not tuned)
  max_iter: 1000                # L-BFGS iterations (upper limit)
  tol: 1.0e-4                   # stop when the largest gradient entry is below this
