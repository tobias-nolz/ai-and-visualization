[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-and-vis-common"
version = "0.1.0"
description = "Shared model, data and inference code for the AI and Visualization lab project (WILDS iWildCam, ResNet-50)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "pyyaml",
    "scikit-learn",
    "tqdm",
]

[project.optional-dependencies]
analysis = [
    # plotting
    "matplotlib",
    "seaborn",
    "plotly",
    "kaleido",            # static (pdf/svg) export of plotly figures; needs Chrome once: `plotly_get_chrome`
    # embeddings, kNN, projections (scikit-learn is a core dependency)
    "umap-learn",
    # explainability: saliency/attribution (captum, grad-cam), SHAP, LIME
    "captum",
    "grad-cam",
    "shap",
    "lime",
    # segmentation (Pair B cut-outs for the background-swap experiment)
    "segment-anything",
    # notebooks
    "ipywidgets",
]
dev = [
    "jupyterlab",
    "nbstripout",
]

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-data]
common = ["config.yaml"]
