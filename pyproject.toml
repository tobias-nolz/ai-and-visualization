[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vis4ai-common"
version = "0.1.0"
description = "Shared model, data and inference code for the Vis4AI lab project (WILDS iWildCam, ResNet-50)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "nbstripout",
]

[tool.setuptools]
packages = ["common"]

[tool.setuptools.package-data]
common = ["config.yaml"]
